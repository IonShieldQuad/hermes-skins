# LILYTHIUM port — MAINFRAME ACCESS (02)
# Generated by port/hermes/make_skins.py from the mainframe-access contract v2.
# Do not hand-edit: re-run the generator after a place changes.
name: lilythium-mainframe-access
description: "LILYTHIUM 02 - Mainframe Access: phosphor-green glass plates on a black machine ground, prompt one step hotter"

colors:
  background: "#020704"
  ui_accent: "#BCF7CE"
  ui_tool: "#BCF7CE"
  banner_accent: "#BCF7CE"
  ui_primary: "#C8EED4"
  banner_title: "#C8EED4"
  ui_text: "#C8EED4"
  banner_text: "#C8EED4"
  ui_label: "#93CFA4"
  banner_dim: "#77AB89"
  ui_thinking: "#77AB89"
  ui_border: "#1F5434"
  banner_border: "#1F5434"
  ui_ok: "#BCF7CE"
  ui_warn: "#FFC04D"
  ui_error: "#FF7070"
  prompt: "#C8EED4"
  input_rule: "#5CF79B"
  response_border: "#318453"
  status_bar_bg: "#071009"
  status_bar_text: "#93CFA4"
  status_bar_good: "#BCF7CE"
  status_bar_warn: "#FFC04D"
  status_bar_bad: "#FF7070"
  status_bar_critical: "#FF7070"
  session_label: "#BCF7CE"
  session_border: "#1F5434"
  diff_added: "#BCF7CE"
  diff_removed: "#FF7070"
  diff_added_word: "#304336"
  diff_removed_word: "#41211F"
  syntax_string: "#C2FF8F"
  syntax_keyword: "#BCF7CE"
  syntax_number: "#C2FF8F"
  syntax_comment: "#77AB89"
  completion_menu_bg: "#071009"
  completion_menu_current_bg: "#163A23"
  completion_menu_meta_bg: "#000000"

branding:
  agent_name: Hermes Agent
  prompt_symbol: "\u276f"

tool_prefix: "\u250a"

customCSS: |
  /* MAINFRAME ACCESS (02) — contract v2 light model */
  /* The app's own token layer is the sanctioned hook: --composer-fill paints
     the input, --dt-user-bubble paints a prompt bubble, --dt-composer-ring
     paints the focus glow. Setting them beats hunting selectors, and the ring
     is what overhangs the plate, so it is dimmed here rather than fought. */
  :root, html {
    --composer-fill: #000000 !important;
    --dt-user-bubble: #000000 !important;
    --composer-ring-strength: 1 !important;
    --dt-composer-ring: rgba(92,247,155,0.3) !important;
  }
  
  /* The app ships 13px conversation text at 1.5 leading. 15px was one step too
     far for this column — it reads as a shout at 1:1 on a wide desk. Keep the
     app's own 13px and buy the reading comfort with leading instead. */
  html {
    --conversation-text-base-size: 0.8125rem !important;
    --dt-line-height: 1.58 !important;
  }
  
  /* Type is the OS: Chakra Petch for signage, JetBrains Mono for every label. */
  @import url("https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap");
  :root, :root.dark {
    --dt-font-sans: "Chakra Petch", "Segoe UI", system-ui, sans-serif !important;
    --dt-font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace !important;
    --dt-letter-spacing: 0.004em !important;
    --radius-scalar: 0 !important;
    --radius: 0 !important;
    /* every surface is opaque: a blur on an opaque plate is a repaint, not depth */
    --theme-blur: none !important;
    /* the light model, addressable from anywhere in this sheet */
    --lx-acc: #5CF79B !important;
    --lx-acc-ink: #BCF7CE !important;
    --lx-soft: rgba(92,247,155,0.18) !important;
    --lx-border: rgba(92,247,155,0.32) !important;
    --lx-border-strong: rgba(92,247,155,0.52) !important;
    --lx-sheen: rgba(210,255,222,0.09) !important;
    --lx-lip: rgba(200,255,215,0.22) !important;
    --lx-shadow-1: 0 0 8px rgba(92,247,155,0.16), inset 0 0 30px rgba(92,247,155,0.05), inset 0 1px 0 rgba(200,255,215,0.22) !important;
    --lx-shadow-2: 0 0 8px rgba(92,247,155,0.16), 0 10px 26px rgba(0,0,0,.55) !important;
    --lx-glow: 0 0 14px rgba(92,247,155,0.32) !important;
    /* surfaces: the mix knobs pass these seeds through unmixed */
    --theme-mix-chrome: 100% !important;
    --theme-mix-sidebar: 100% !important;
    --theme-mix-card: 100% !important;
    --theme-mix-elevated: 100% !important;
    --theme-mix-bubble: 100% !important;
    --theme-card-seed: #000000 !important;
    --theme-elevated-seed: #071009 !important;
    --theme-bubble-seed: #000000 !important;
    --theme-sidebar-seed: #071009 !important;
    --theme-background-seed: #020704 !important;
    --theme-midground: rgba(92,247,155,0.32) !important;
    --dt-sidebar-border: rgba(92,247,155,0.52) !important;
    --sidebar-edge-border: rgba(92,247,155,0.52) !important;
    --noise-opacity-mul: 0.071 !important;
  }
  
  /* FIELD — the ground is a scene, not a colour. */
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2147482900;
    background-image:
      radial-gradient(120% 140% at 50% -8%, rgba(92,247,155,0.1) 0%, rgba(92,247,155,0) 60%),
      radial-gradient(80% 60% at 63% 38%, #072A19 0%, transparent 62%),
      radial-gradient(120% 70% at 14% 96%, #072A19 0%, transparent 72%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0 1px, transparent 1px 120px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.024) 0 1px, transparent 1px 120px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 6px);
    mix-blend-mode: screen;
  }
  
  /* THE TRANSCRIPT IS A SCREEN OF PANELS — the desk's own log: one bordered
     band per agent message, fill lifted a step off the field, accent hairline
     and an emissive halo. Verified against the app source: the assistant root
     is per message (`data-role=assistant`), so a frame here is one panel per
     reply rather than one frame around the whole session. */
  [data-slot="aui_thread-viewport"], [data-slot="aui_thread-content"],
  [data-slot="aui_message-group"] {
    background: none !important;
    background-image: none !important;
    box-shadow: none !important;
    border: 0 !important;
    border-radius: 0 !important;
  }
  /* the panel: a lit glass plate. Three stacked layers do the work — a white-
     green gloss band across the crown, the dark face itself, and a hairline
     painted as a border-box gradient that runs cool at the corners and full
     accent through the middle. Around it a 1px ring, a tight bloom and a wide
     falloff, plus an inset lip so the top edge catches light. Measured by eye
     against a flat hairline card: the hairline alone read as a table row, this
     reads as a pane. */
  [data-slot="aui_assistant-message-root"] {
    background:
      linear-gradient(180deg, rgba(210,255,222,0.08) 0%, rgba(210,255,222,0) 34px) padding-box,
      linear-gradient(180deg, #0C1E12 0%, #030704 100%) padding-box,
      linear-gradient(90deg, rgba(92,247,155,0.45) 0%, rgba(92,247,155,0.85) 50%, rgba(92,247,155,0.45) 100%) border-box !important;
    border: 1px solid transparent !important;
    border-radius: 0 !important;
    box-shadow: 0 0 0 1px rgba(92,247,155,0.18), 0 0 22px rgba(92,247,155,0.15), 0 0 54px rgba(92,247,155,0.055), inset 0 1px 0 rgba(210,255,222,0.2), inset 0 0 40px rgba(92,247,155,0.04) !important;
    padding: 12px 14px 8px !important;
    margin: 0 0 12px !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    transition: box-shadow .16s linear !important;
  }
  [data-slot="aui_assistant-message-root"]:hover {
    box-shadow: 0 0 0 1px rgba(92,247,155,0.28), 0 0 30px rgba(92,247,155,0.22), 0 0 68px rgba(92,247,155,0.09), inset 0 1px 0 rgba(210,255,222,0.26), inset 0 0 40px rgba(92,247,155,0.06) !important;
  }
  /* nothing between the panel and its text paints a second face */
  [data-slot="aui_assistant-message-content"] {
    background: none !important;
    background-image: none !important;
    box-shadow: none !important;
    border: 0 !important;
    border-radius: 0 !important;
  }
  /* furniture inside the transcript keeps square corners */
  [data-slot="aui_thread-content"] * { border-radius: 0 !important; }
  
  /* A PROMPT IS THE HOT STROKE — darker than an agent panel (a hole cut in
     the field, not a plate on it), with the accent hairline at near-full
     value and a halo that reads across the column. Same geometry as the
     panel so the two stack as one instrument. */
  [data-slot="aui_user-message-root"] {
    margin: 0 0 10px !important;
    margin-inline: 0 !important;
    padding-inline: 0 !important;
    width: 100% !important;
    max-width: 100% !important;
    display: block !important;
    background: none !important;
    background-image: none !important;
    box-shadow: none !important;
    border: 0 !important;
  }
  /* a prompt takes the whole measure, like the panels above it — the bubble is
     no longer a right-shifted chip, it is the same plate with a hotter frame. */
  [data-slot="aui_user-message-root"] .composer-human-message {
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    display: block !important;
    text-align: left !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    background:
      linear-gradient(180deg, rgba(210,255,222,0.07) 0%, rgba(210,255,222,0) 28px) padding-box,
      #000000 padding-box,
      linear-gradient(90deg, rgba(92,247,155,0.7) 0%, rgba(92,247,155,1) 50%, rgba(92,247,155,0.7) 100%) border-box !important;
    background-clip: padding-box, padding-box, border-box !important;
    border: 1px solid transparent !important;
    border-radius: 0 !important;
    padding: 12px 16px !important;
    box-shadow: 0 0 0 1px rgba(92,247,155,0.26), 0 0 26px rgba(92,247,155,0.4), 0 0 64px rgba(92,247,155,0.16), inset 0 1px 0 rgba(210,255,222,0.2), inset 0 0 36px rgba(92,247,155,0.16) !important;
  }
  /* the text span inside the bubble inherits, never paints its own face */
  [data-slot^="aui_user-"] { background-color: transparent !important; text-align: left !important; }
  
  /* COMPOSER — the same hot stroke as the prompt: true black well, accent
     hairline at 0.78, and a halo that survives the field's own grid. The
     focus state lifts the hairline and the bloom; nothing moves.
     Geometry: the dock is `position:absolute` and the app centres it with
     Tailwind v4's `-translate-x-1/2`, which writes the **`translate` property**,
     not `transform`. So it is invisible to a `transform` override, and margins
     alone can never align it: shifting the margins shifts the box, and the
     -50% translate then shifts the shift. `translate: none` + matching left/right
     insets is the only combination that lands it exactly on the transcript
     column (24px, the same inset the thread content uses) at any window width. */
  [data-slot="composer-dock"] {
    background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.20) 100%) 0 0/100% 100% no-repeat,
  #000000 !important;
    border-radius: 0 !important;
    translate: none !important;
    left: 24px !important;
    right: 24px !important;
    width: auto !important;
    margin: 0 0 12px !important;
    border: 1px solid rgba(92,247,155,0.86) !important;
    box-shadow: 0 0 0 1px rgba(92,247,155,0.18), 0 0 34px rgba(92,247,155,0.34), 0 0 82px rgba(92,247,155,0.12), inset 0 1px 0 rgba(210,255,222,0.14), inset 0 0 30px rgba(92,247,155,0.08) !important;
    transition: box-shadow .18s linear, border-color .18s linear !important;
  }
  [data-slot="composer-dock"]:focus-within {
    border-color: rgba(92,247,155,0.95) !important;
    box-shadow: 0 0 0 1px rgba(92,247,155,0.16), 0 0 34px rgba(92,247,155,0.36), inset 0 0 30px rgba(92,247,155,0.1) !important;
  }
  /* Every wrapper inside is naked — one well, one hairline — and nothing keeps
     a curve, because a mitred plate with one rounded child reads as a bug. */
  /* SCOPE IS LOAD-BEARING, twice over. `composer-root` is itself nested inside
     other composer wrappers, so the reset has to exclude the dock; and
     `composer-bounds` is an ANCESTOR OF THE WHOLE TRANSCRIPT — a reset written
     as [data-slot^=composer] * therefore matches every message root and the
     prompt bubble, and transparent-ises each panel one rule after it is drawn
     (specificity 0,2,0, so no !important on a 0,1,0 selector can recover it).
     Anchor on the dock itself and the reset can only reach the dock's own
     children. */
  [data-slot="composer-dock"] *:not([data-slot="composer-dock"]),
  [data-slot="composer-surface"], [data-slot="composer-rich-input"] {
    background: transparent !important;
    background-image: none !important;
    box-shadow: none !important;
    border-color: transparent !important;
    border-radius: 0 !important;
  }
  /* A radius that survives every class rule lives on a pseudo-element ring, and
     `*` never matches a pseudo. Kill those, then forbid the curve outright: a
     clip-path cannot be rounded by anything downstream. */
  [data-slot="composer-dock"] *:not([data-slot="composer-dock"])::before,
  [data-slot="composer-dock"] *:not([data-slot="composer-dock"])::after,
  [data-slot="composer-dock"]::before, [data-slot="composer-dock"]::after {
    border-radius: 0 !important;
    background: none !important;
    box-shadow: none !important;
  }
  [data-slot="composer-dock"] {
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%) !important;
  }
  
  /* RAIL — a plate of its own with the hairline on the seam, not a gap. */
  /* The rail's bloom cannot escape its own clipping context: an outer
     box-shadow on the sidebar paints nothing past the pane wrapper, and an
     inset one is buried under the sidebar's own opaque children (measured —
     the falloff beside the seam stayed flat both ways). The light is therefore
     painted where nothing can clip or cover it: a pseudo-element strip laid
     OVER the top of the thread, fading out from the seam. Measured falloff:
     +50 green at the seam, still +12 at 40px, gone by 72px. */
  [data-slot="sidebar"] {
    background-image:
      linear-gradient(180deg, rgba(210,255,222,0.045) 0%, rgba(210,255,222,0) 180px),
      linear-gradient(0deg, rgba(92,247,155,0.035) 0%, rgba(92,247,155,0) 55%) !important;
    box-shadow: inset -1px 0 0 rgba(92,247,155,0.62) !important;
  }
  [data-slot="thread"] { position: relative !important; }
  [data-slot="thread"]::before {
    content: "" !important;
    position: absolute !important;
    inset: 0 auto 0 0 !important;
    width: 72px !important;
    pointer-events: none !important;
    z-index: 6 !important;
    background: linear-gradient(90deg, rgba(92,247,155,0.22) 0%, rgba(92,247,155,0.06) 45%, rgba(92,247,155,0) 100%) !important;
  }
  
  /* STATUS — the desk's bar, not the OS's. */
  [data-slot="statusbar"] {
    background: #071009 !important;
    box-shadow: inset 0 1px 0 rgba(92,247,155,0.32) !important;
  }
  
  /* SELECTED CHIPS — the app paints them `bg-primary` with white or
     primary-foreground text, because in its own palette primary is a
     saturated fill. In this palette ui_primary is the PALE ink (it also
     carries transcript text), so that pair is pale-on-pale: the letter in a
     clarify option was invisible, which is a legibility bug, not a style
     call. Keep the bright fill — it reads as the accent plate — and flip the
     ink inside it to the ground. */
  html, :root {
    --dt-primary-foreground: #020704 !important;
  }
  [class~="bg-primary"][class~="text-white"],
  [class~="bg-primary"][class~="text-primary-foreground"] {
    color: #020704 !important;
    -webkit-text-fill-color: #020704 !important;
  }
  /* ---- LAYOUT: BLOCKS ---- */
  /* the turn itself is not a panel any more, it is the field */
  [data-slot="aui_assistant-message-root"] {
    background: none !important;
    background-image: none !important;
    border: 0 !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  /* a tool call: the same glass as the turn panel, at row scale. Only the
     outermost tool-block is plated — the app nests one inside another and
     both carry the same box, so a naive selector draws every frame twice. */
  [data-slot="tool-block"]:not([data-slot="tool-block"] [data-slot="tool-block"]) {
    background:
      linear-gradient(180deg, rgba(210,255,222,0.07) 0%, rgba(210,255,222,0) 26px) padding-box,
      linear-gradient(180deg, #0C1E12 0%, #030704 100%) padding-box,
      linear-gradient(90deg, rgba(92,247,155,0.4) 0%, rgba(92,247,155,0.85) 50%, rgba(92,247,155,0.4) 100%) border-box !important;
    border: 1px solid transparent !important;
    border-radius: 0 !important;
    box-shadow: 0 0 0 1px rgba(92,247,155,0.14), 0 0 18px rgba(92,247,155,0.12), inset 0 1px 0 rgba(210,255,222,0.16) !important;
    padding: 6px 12px !important;
    margin: 0 0 8px !important;
    box-sizing: border-box !important;
    max-width: 100% !important;
  }
  /* a thinking block stays bare. Framing a collapsed 20px affordance turns it
     into a horizontal rule and the transcript into a striped wall — measured
     that way, and rejected. It is a label, not a plate; only things with a
     body (tool calls, diffs, output) get a frame. */
  [data-slot="aui_thinking-disclosure"] {
    background: none !important;
    background-image: none !important;
    border: 0 !important;
    box-shadow: none !important;
    margin: 0 0 10px !important;
  }
  /* the frames must not stack: an inner thinking block inside a tool call
     carries no plate of its own */
  [data-slot="tool-block"] [data-slot="aui_thinking-disclosure"],
  [data-slot="tool-block"] [data-slot="tool-block"] {
    border: 0 !important;
    box-shadow: none !important;
    margin: 0 !important;
    padding: 0 !important;
    background-image: none !important;
    background-color: transparent !important;
  }
